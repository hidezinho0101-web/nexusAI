
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101116">
  <title>Nexus AI</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101116;
      --panel: #171920;
      --panel2: #20232c;
      --text: #f3f4f8;
      --muted: #a2a6b5;
      --border: #303440;
      --accent: #9b8cff;
      --user: #292642;
    }

    body.light {
      color-scheme: light;
      --bg: #f5f6fb;
      --panel: #ffffff;
      --panel2: #eceef6;
      --text: #20212b;
      --muted: #686b7a;
      --border: #dfe1eb;
      --accent: #6651db;
      --user: #e9e5ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.55 system-ui, sans-serif;
      min-height: 100vh;
    }

    button, textarea { font: inherit; }

    button {
      cursor: pointer;
      color: var(--text);
      border: 1px solid var(--border);
      background: var(--panel2);
      border-radius: 12px;
      padding: 10px 13px;
    }

    button:hover { border-color: var(--accent); }
    button:disabled { opacity: .6; cursor: wait; }

    .app { min-height: 100vh; display: flex; flex-direction: column; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }

    .brand { display: flex; align-items: center; gap: 10px; }

    .logo {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      background: var(--accent);
      color: white;
      font-weight: 800;
      font-size: 20px;
    }

    h1 { font-size: 17px; margin: 0; }
    .subtitle { color: var(--muted); font-size: 12px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }

    main {
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
      padding: 28px 18px 160px;
      flex: 1;
    }

    #welcome { text-align: center; padding: 9vh 0 30px; }
    #welcome .big { font-size: clamp(32px, 6vw, 48px); margin: 0 0 8px; }
    #welcome p { color: var(--muted); }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 9px;
      margin-top: 24px;
    }

    .suggestions button { background: var(--panel); }

    #messages { display: flex; flex-direction: column; gap: 18px; }

    .message { display: flex; flex-direction: column; gap: 5px; }
    .message.user { align-items: flex-end; }
    .who { color: var(--muted); font-size: 12px; }

    .bubble {
      max-width: 90%;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      padding: 13px 16px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel);
    }

    .user .bubble { background: var(--user); }

    .bubble p { margin: 0 0 10px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble h1, .bubble h2, .bubble h3 { margin: 14px 0 7px; line-height: 1.3; }
    .bubble ul, .bubble ol { padding-left: 24px; margin: 8px 0; }
    .bubble li { margin: 4px 0; }
    .bubble strong { color: var(--text); }
    .bubble code {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: .92em;
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 2px 5px;
    }
    .bubble pre {
      margin: 12px 0 2px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #0b0c11;
      color: #f1f1f5;
      white-space: pre;
    }
    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 7px 10px;
      border-bottom: 1px solid #303440;
      color: #b9bbca;
      font-size: 11px;
    }
    .code-header button { padding: 4px 8px; font-size: 11px; }
    .bubble pre code {
      display: block;
      padding: 13px;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: inherit;
      font-size: 13px;
      line-height: 1.55;
      white-space: pre;
    }
    .bubble a { color: var(--accent); }

    .notice {
      border: 1px solid var(--border);
      color: var(--muted);
      background: var(--panel);
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 13px;
      margin-top: 24px;
    }

    .composer-wrap {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px 18px max(16px, env(safe-area-inset-bottom));
      background: linear-gradient(transparent, var(--bg) 20%);
    }

    .composer {
      max-width: 850px;
      margin: auto;
      padding: 10px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 8px 30px #0002;
    }

    textarea {
      flex: 1;
      min-width: 0;
      resize: none;
      max-height: 150px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      padding: 10px;
      line-height: 1.5;
    }

    #send {
      background: var(--accent);
      color: white;
      border: 0;
      font-weight: 700;
    }

    .footer-note {
      max-width: 850px;
      margin: 7px auto 0;
      text-align: center;
      color: var(--muted);
      font-size: 11px;
    }

    @media (max-width: 520px) {
      header { padding: 12px; }
      .actions { gap: 5px; }
      .actions button { padding: 9px; font-size: 12px; }
      main { padding-inline: 12px; }
      .bubble { max-width: 96%; }
    }
  </style>
</head>

<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">N</div>
      <div>
        <h1>Nexus AI</h1>
        <div class="subtitle">Seu espaço de ideias</div>
      </div>
    </div>

    <div class="actions">
      <button id="newChat" type="button">＋ Nova</button>
      <button id="theme" type="button">☼ Tema</button>
      <button id="export" type="button">↓ Exportar</button>
    </div>
  </header>

  <main>
    <section id="welcome">
      <h2 class="big">Olá! Eu sou o Nexus.</h2>
      <p>O começo do seu próprio assistente de IA.</p>

      <div class="suggestions">
        <button data-prompt="Me ajude a criar um projeto.">Criar um projeto</button>
        <button data-prompt="Explique um assunto de forma simples.">Aprender algo</button>
        <button data-prompt="Me ajude a escrever um texto.">Escrever um texto</button>
      </div>

      <div class="notice">
        Converse com o Nexus AI e suas mensagens ficarão salvas
        neste navegador.
      </div>
    </section>

    <section id="messages" aria-live="polite"></section>
  </main>

  <div class="composer-wrap">
    <form id="form" class="composer">
      <textarea
        id="input"
        rows="1"
        maxlength="4000"
        placeholder="Escreva sua mensagem..."
        aria-label="Sua mensagem"
      ></textarea>
      <button id="send" type="submit">Enviar</button>
    </form>

    <div class="footer-note">
      O histórico fica neste navegador. Evite guardar informações secretas.
    </div>
  </div>
</div>

<script>
  const $ = selector => document.querySelector(selector);

  const messagesEl = $("#messages");
  const welcome = $("#welcome");
  const input = $("#input");
  const form = $("#form");
  const sendButton = $("#send");

  const API_URL =
    "https://nexus-ai-api.hidezinho0101.workers.dev/api/chat";

  const STORAGE_KEY = "nexus-ai-chats-v1";
  const THEME_KEY = "nexus-ai-theme-v1";

  let chats = loadChats();
  let currentId;

  if (chats.length) {
    currentId = chats[chats.length - 1].id;
  } else {
    currentId = makeId();
    chats.push({
      id: currentId,
      title: "Nova conversa",
      messages: []
    });
    saveChats();
  }

  function makeId() {
    return Date.now().toString(36) +
      Math.random().toString(36).slice(2, 8);
  }

  function loadChats() {
    try {
      const data = JSON.parse(
        localStorage.getItem(STORAGE_KEY) || "[]"
      );

      if (!Array.isArray(data)) return [];

      return data.filter(chat =>
        chat &&
        typeof chat.id === "string" &&
        Array.isArray(chat.messages)
      );
    } catch {
      return [];
    }
  }

  function currentChat() {
    let chat = chats.find(item => item.id === currentId);

    if (!chat) {
      chat = {
        id: currentId,
        title: "Nova conversa",
        messages: []
      };
      chats.push(chat);
    }

    return chat;
  }

  function saveChats() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
    } catch (error) {
      console.error("Não foi possível salvar o histórico:", error);
    }
  }

  function addMessage(role, content) {
    const chat = currentChat();

    const message = {
      role,
      content,
      time: new Date().toISOString()
    };

    chat.messages.push(message);

    if (role === "user" && chat.title === "Nova conversa") {
      chat.title = content.slice(0, 42);
    }

    saveChats();
    render();

    return message;
  }

  function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, character => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[character]);
  }

  function renderMarkdown(source) {
    const codeBlocks = [];
    const fence = new RegExp("\\x60\\x60\\x60([^\\n\\x60]*)\\n?([\\s\\S]*?)\\x60\\x60\\x60", "g");
    let text = String(source || "").replace(fence, (_, language, code) => {
      const index = codeBlocks.length;
      codeBlocks.push({ language: language.trim() || "código", code });
      return "NEXUSCODEBLOCK" + index + "END";
    });

    text = escapeHTML(text);
    text = text.replace(/^### (.+)$/gm, "<h3>$1</h3>")
      .replace(/^## (.+)$/gm, "<h2>$1</h2>")
      .replace(/^# (.+)$/gm, "<h1>$1</h1>")
      .replace(/\\*\\*(.+?)\\*\\*/gs, "<strong>$1</strong>")
      .replace(/__([^_]+)__/g, "<strong>$1</strong>")
      .replace(new RegExp("\\x60([^\\x60\\n]+)\\x60", "g"), "<code>$1</code>")
      .replace(/\\[([^\\]]+)\\]\\((https?:\\/\\/[^\\s)]+)\\)/g,
        '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');

    const lines = text.split("\\n");
    const output = [];
    let inList = false;
    let listType = "";

    for (const line of lines) {
      const match = line.match(/^\\s*([-*]|\\d+\\.)\\s+(.+)$/);
      if (match) {
        const type = /^\\d+\\./.test(match[1]) ? "ol" : "ul";
        if (!inList || listType !== type) {
          if (inList) output.push("</" + listType + ">");
          output.push("<" + type + ">");
          inList = true;
          listType = type;
        }
        output.push("<li>" + match[2] + "</li>");
      } else {
        if (inList) {
          output.push("</" + listType + ">");
          inList = false;
          listType = "";
        }
        if (line.trim()) output.push("<p>" + line + "</p>");
      }
    }
    if (inList) output.push("</" + listType + ">");

    let html = output.join("");
    codeBlocks.forEach((block, index) => {
      const codeHTML = '<pre><div class="code-header"><span>' +
        escapeHTML(block.language) +
        '</span><button type="button" class="copy-code">Copiar código</button></div><code>' +
        escapeHTML(block.code) + '</code></pre>';
      html = html.replace("NEXUSCODEBLOCK" + index + "END", codeHTML);
    });
    return html;
  }

  function render() {
    const chat = currentChat();
    messagesEl.replaceChildren();
    welcome.hidden = chat.messages.length > 0;

    chat.messages.forEach(message => {
      const article = document.createElement("article");
      article.className =
        "message " + (message.role === "user" ? "user" : "assistant");

      const who = document.createElement("div");
      who.className = "who";
      who.textContent =
        message.role === "user" ? "Você" : "Nexus AI";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      if (message.role === "user") {
        bubble.textContent = message.content;
      } else {
        bubble.innerHTML = renderMarkdown(message.content);
        bubble.querySelectorAll(".copy-code").forEach(button => {
          button.addEventListener("click", async () => {
            const code = button.closest("pre").querySelector("code").textContent;
            try {
              await navigator.clipboard.writeText(code);
              button.textContent = "Copiado!";
              setTimeout(() => button.textContent = "Copiar código", 1400);
            } catch {
              button.textContent = "Selecione o código";
            }
          });
        });
      }
      article.append(who, bubble);
      messagesEl.append(article);
    });
  }

  function newChat() {
    currentId = makeId();

    chats.push({
      id: currentId,
      title: "Nova conversa",
      messages: []
    });

    saveChats();
    render();
    input.focus();
  }

  form.addEventListener("submit", async event => {
    event.preventDefault();

    const text = input.value.trim();

    if (!text || sendButton.disabled) return;

    // Guarda a conversa em que a mensagem foi enviada.
    const chat = currentChat();

    addMessage("user", text);

    input.value = "";
    input.style.height = "auto";

    sendButton.disabled = true;
    sendButton.textContent = "Aguarde...";

    const pendingMessage = addMessage("assistant", "Pensando...");

    // Não envia o marcador "Pensando..." ao modelo.
    const messages = chat.messages
      .filter(message =>
        ["user", "assistant"].includes(message.role) &&
        typeof message.content === "string" &&
        message !== pendingMessage
      )
      .slice(-12)
      .map(message => ({
        role: message.role,
        content: message.content
      }));

    try {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ messages })
      });

      let data;

      try {
        data = await response.json();
      } catch {
        throw new Error("O servidor retornou uma resposta inválida.");
      }

      if (!response.ok) {
        throw new Error(
          data.error || `Erro HTTP ${response.status}`
        );
      }

      if (typeof data.reply !== "string" || !data.reply.trim()) {
        throw new Error("A IA não retornou uma resposta.");
      }

      pendingMessage.content = data.reply;
    } catch (error) {
      console.error("Erro no Nexus AI:", error);

      pendingMessage.content =
        "Não consegui obter uma resposta. " +
        "Detalhe: " + (error.message || "erro de conexão") +
        ". Confira o Worker e tente novamente.";
    } finally {
      saveChats();
      render();

      sendButton.disabled = false;
      sendButton.textContent = "Enviar";
      input.focus();
    }
  });

  input.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      form.requestSubmit();
    }
  });

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height =
      Math.min(input.scrollHeight, 150) + "px";
  });

  $("#newChat").addEventListener("click", newChat);

  $("#theme").addEventListener("click", () => {
    document.body.classList.toggle("light");

    localStorage.setItem(
      THEME_KEY,
      document.body.classList.contains("light") ? "light" : "dark"
    );
  });

  document.querySelectorAll("[data-prompt]").forEach(button => {
    button.addEventListener("click", () => {
      input.value = button.dataset.prompt;
      input.focus();
      input.dispatchEvent(new Event("input"));
    });
  });

  $("#export").addEventListener("click", () => {
    const chat = currentChat();

    const content = chat.messages.map(message =>
      (message.role === "user" ? "Você" : "Nexus AI") +
      ":\n" + message.content
    ).join("\n\n");

    const blob = new Blob(
      [content],
      { type: "text/plain;charset=utf-8" }
    );

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = "nexus-conversa.txt";
    link.click();

    URL.revokeObjectURL(url);
  });

  if (localStorage.getItem(THEME_KEY) === "light") {
    document.body.classList.add("light");
  }

  render();
</script>
</body>
</html>
